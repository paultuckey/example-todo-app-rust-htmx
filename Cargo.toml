[package]
name = "example-todo-app-rust-htmx"
version = "1.0.0"
edition = "2024"

[dependencies]

# db
sqlx = { version = "0.9.0", features = ["runtime-async-std", "sqlite"] }

# threading
tokio = { version = "1.53", features = ["full"] }

# web framework
axum = "0.8"

# templating
typed-handlebars = { version = "0.2.0" }

# form serialization
serde = { version = "1.0", features = ["derive"] }

# logging
tracing = "0.1"
tracing-subscriber = "0.3"